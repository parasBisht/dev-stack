# Plain PHP / WordPress: the project folder itself is the web root
# Copy to nginx/sites/<name>.conf (top level), edit the 3 marked lines, then:
#   docker compose exec nginx nginx -s reload
server {
    listen 80;
    server_name myproject.local;                    # 1. your domain (also add it to /etc/hosts)
    root /var/www/myproject;                # 2. path INSIDE the container: /var/www/<folder under PROJECTS_PATH>
    index index.php index.html;

    client_max_body_size 100M;
    gzip on;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        set $upstream php-fpm-82:9000;              # 3. PHP version: php-fpm-74 | 81 | 82 | 83
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
        include fastcgi_params;
    }

    location ~ /\.ht { deny all; }
}
