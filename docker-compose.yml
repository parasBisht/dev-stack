networks:
  web:
    driver: bridge

volumes:
  mysql-data:
  minio-data:
  memcached-data:

services:

### PHP 7.4 ##############################################
  php-fpm-74:
    build: ./php-fpm-74
    restart: always
    volumes:
      - ${PROJECTS_PATH}:/var/www
    networks:
      - web

### PHP 8.3 ##############################################
  php-fpm-83:
    build: ./php-fpm-83
    restart: always
    volumes:
      - ${PROJECTS_PATH}:/var/www
    networks:
      - web

### PHP 8.2 ##############################################
  php-fpm-82:
    build: ./php-fpm-82
    restart: always
    volumes:
      - ${PROJECTS_PATH}:/var/www
    networks:
      - web

### PHP 8.1 ##############################################
  php-fpm-81:
    build: ./php-fpm-81
    restart: always
    volumes:
      - ${PROJECTS_PATH}:/var/www
    networks:
      - web

### PHP 7.1 ##############################################
  php-fpm-71:
    build: ./php-fpm-71
    restart: always
    volumes:
      - ${PROJECTS_PATH}:/var/www
    networks:
      - web

### Nginx ################################################
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ${PROJECTS_PATH}:/var/www
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/sites:/etc/nginx/sites-available
    depends_on:
      - php-fpm-74
      - php-fpm-71
    networks:
      - web

### MySQL ################################################
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/dev.cnf:ro
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - web

### Memcached ############################################
  memcached:
    image: memcached:alpine
    restart: always
    ports:
      - "${MEMCACHED_PORT}:11211"
    networks:
      - web

### Minio ################################################
  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    networks:
      - web

### Adminer ##############################################
  adminer:
    image: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: ${ADMINER_DEFAULT_SERVER}
    volumes:
      - ./adminer/index.php:/var/www/html/index.php:ro
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - web
